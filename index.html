<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>메뉴 원가 계산기 MVP</title>
  <style>
    :root {
      --bg:#f6f7f9;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --accent:#2d4737;
      --accent2:#eef4f0;
      --danger:#b42318;
      --warn:#b54708;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:1180px;margin:0 auto;padding:32px 20px 64px}
    h1{font-size:30px;margin:0 0 8px}
    .subtitle{color:var(--muted);margin-bottom:24px}
    .grid{display:grid;gap:16px}
    .metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}
    .cols{grid-template-columns:1fr 1fr}
    .card,.metric{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
    .metric{padding:18px}
    .metric .label{font-size:13px;color:var(--muted)}
    .metric .value{font-size:26px;font-weight:700;margin-top:6px}
    .card{padding:22px}
    h2{font-size:19px;margin:0 0 6px}
    .desc{font-size:14px;color:var(--muted);margin-bottom:18px}
    .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{display:block;font-size:13px;font-weight:600}
    input,select{width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px}
    button{border:0;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer}
    .primary{width:100%;margin-top:14px;background:var(--accent);color:white}
    .secondary{background:white;border:1px solid var(--line)}
    .delete{background:white;border:1px solid var(--line);padding:7px 10px}
    .callout{margin-top:14px;padding:13px 14px;background:var(--accent2);border-radius:12px;font-size:14px}
    table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}
    th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
    th{font-size:12px;color:var(--muted)}
    .small{font-size:12px;color:var(--muted);margin-top:3px}
    .recipe-add{display:grid;grid-template-columns:1fr 130px auto;gap:10px;margin-top:14px;align-items:end}
    .result{margin-top:20px}
    .badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#eef2f7}
    .badge.warn{background:#fff4e5;color:var(--warn)}
    .badge.danger{background:#feeceb;color:var(--danger)}
    .headerrow{display:flex;justify-content:space-between;gap:12px;align-items:center}
    @media (max-width:860px){
      .metrics,.cols{grid-template-columns:1fr 1fr}
    }
    @media (max-width:640px){
      .metrics,.cols,.formgrid{grid-template-columns:1fr}
      .recipe-add{grid-template-columns:1fr}
      h1{font-size:25px}
      .wrap{padding:22px 14px 40px}
      .table-wrap{overflow-x:auto}
      table{min-width:620px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>메뉴 원가 계산기 MVP</h1>
    <div class="subtitle">재료 단가와 레시피 사용량을 기준으로 메뉴 원가와 권장 판매가를 계산합니다.</div>

    <section class="grid metrics">
      <div class="metric"><div class="label">재료 수</div><div id="ingredientCount" class="value">0개</div></div>
      <div class="metric"><div class="label">메뉴 원가</div><div id="totalCostMetric" class="value">0원</div></div>
      <div class="metric"><div class="label">현재 원가율</div><div id="costRateMetric" class="value">0%</div></div>
      <div class="metric"><div class="label">권장 판매가</div><div id="recommendedMetric" class="value">0원</div></div>
    </section>

    <section class="grid cols">
      <div class="card">
        <h2>1. 재료 등록</h2>
        <div class="desc">재료의 매입 단위와 단위당 매입가를 등록합니다.</div>

        <div class="formgrid">
          <label>재료명
            <input id="ingredientName" placeholder="예: 원두" />
          </label>
          <label>구분
            <select id="ingredientType">
              <option value="원재료">원재료</option>
              <option value="일회용품">일회용품</option>
            </select>
          </label>
          <label>매입 단위
            <select id="purchaseUnit">
              <option value="kg">kg</option>
              <option value="L">L</option>
              <option value="개">개</option>
            </select>
          </label>
          <label>단위당 매입가(원)
            <input id="purchasePrice" type="number" min="0" placeholder="예: 30000" />
          </label>
        </div>

        <div id="unitPreview" class="callout">매입 단위와 가격을 입력하면 사용 단가가 표시됩니다.</div>
        <button id="addIngredientBtn" class="primary">재료 추가</button>

        <div class="table-wrap">
          <table>
            <thead><tr><th>재료</th><th>매입가</th><th>사용 단가</th><th>관리</th></tr></thead>
            <tbody id="ingredientTable"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2>2. 메뉴 레시피</h2>
        <div class="desc">메뉴에 들어가는 재료와 실제 사용량을 입력합니다.</div>

        <div class="formgrid">
          <label>메뉴명
            <input id="menuName" value="아이스 카페라테" />
          </label>
          <label>현재 판매가(원)
            <input id="salePrice" type="number" min="0" value="4000" />
          </label>
          <label>목표 원가율(%)
            <input id="targetRate" type="number" min="1" max="100" step="0.1" value="30" />
          </label>
          <label>판매가 반올림 단위
            <select id="roundingUnit">
              <option value="10">10원</option>
              <option value="100" selected>100원</option>
              <option value="500">500원</option>
            </select>
          </label>
        </div>

        <div class="recipe-add">
          <label>재료 선택
            <select id="recipeIngredient"></select>
          </label>
          <label>사용량
            <input id="usageAmount" type="number" min="0.001" step="0.001" placeholder="예: 18" />
          </label>
          <button id="addRecipeBtn" class="secondary">추가</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead><tr><th>재료</th><th>사용량</th><th>원가</th><th>관리</th></tr></thead>
            <tbody id="recipeTable"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="card result">
      <div class="headerrow">
        <div>
          <h2>메뉴 원가 요약</h2>
          <div class="desc" style="margin:4px 0 0">현재 판매가와 목표 원가율을 기준으로 계산합니다.</div>
        </div>
        <span id="statusBadge" class="badge">계산 대기</span>
      </div>
      <div id="resultText" class="callout"></div>
    </section>
  </main>

<script>
const state = {
  ingredients: [
    {id:1,name:'원두',type:'원재료',purchaseUnit:'kg',purchasePrice:30000},
    {id:2,name:'우유',type:'원재료',purchaseUnit:'L',purchasePrice:2500},
    {id:3,name:'아이스컵',type:'일회용품',purchaseUnit:'개',purchasePrice:70},
    {id:4,name:'뚜껑',type:'일회용품',purchaseUnit:'개',purchasePrice:30}
  ],
  recipe: [
    {ingredientId:1,usageAmount:18},
    {ingredientId:2,usageAmount:200},
    {ingredientId:3,usageAmount:1},
    {ingredientId:4,usageAmount:1}
  ]
};

const $ = id => document.getElementById(id);
const money = v => Math.round(v).toLocaleString('ko-KR') + '원';
const pct = v => (isFinite(v) ? v : 0).toFixed(1) + '%';

function usageUnit(unit){ return unit==='kg' ? 'g' : unit==='L' ? 'ml' : '개'; }
function divisor(unit){ return unit==='kg'||unit==='L' ? 1000 : 1; }
function unitPrice(i){ return i.purchasePrice / divisor(i.purchaseUnit); }
function ingredient(id){ return state.ingredients.find(x=>x.id===id); }

function updatePreview(){
  const unit=$('purchaseUnit').value;
  const price=Number($('purchasePrice').value)||0;
  if(!price){ $('unitPreview').textContent='매입 단위와 가격을 입력하면 사용 단가가 표시됩니다.'; return; }
  $('unitPreview').innerHTML=`${unit}당 <strong>${money(price)}</strong> → ${usageUnit(unit)}당 <strong>${(price/divisor(unit)).toFixed(2)}원</strong>`;
}

function renderIngredients(){
  $('ingredientTable').innerHTML=state.ingredients.map(i=>`
    <tr>
      <td>${i.name}<div class="small">${i.type}</div></td>
      <td>${money(i.purchasePrice)}/${i.purchaseUnit}</td>
      <td>${unitPrice(i).toFixed(2)}원/${usageUnit(i.purchaseUnit)}</td>
      <td><button class="delete" data-del-ing="${i.id}">삭제</button></td>
    </tr>`).join('');

  $('recipeIngredient').innerHTML=state.ingredients.map(i=>
    `<option value="${i.id}">${i.name} (${usageUnit(i.purchaseUnit)})</option>`
  ).join('');

  document.querySelectorAll('[data-del-ing]').forEach(btn=>{
    btn.onclick=()=>{
      const id=Number(btn.dataset.delIng);
      state.ingredients=state.ingredients.filter(x=>x.id!==id);
      state.recipe=state.recipe.filter(x=>x.ingredientId!==id);
      renderAll();
    };
  });
}

function renderRecipe(){
  $('recipeTable').innerHTML=state.recipe.map((r,idx)=>{
    const i=ingredient(r.ingredientId);
    if(!i) return '';
    const cost=unitPrice(i)*r.usageAmount;
    return `<tr>
      <td>${i.name}<div class="small">${i.type}</div></td>
      <td>${r.usageAmount}${usageUnit(i.purchaseUnit)}</td>
      <td>${money(cost)}</td>
      <td><button class="delete" data-del-rec="${idx}">삭제</button></td>
    </tr>`;
  }).join('');

  document.querySelectorAll('[data-del-rec]').forEach(btn=>{
    btn.onclick=()=>{
      state.recipe.splice(Number(btn.dataset.delRec),1);
      renderAll();
    };
  });
}

function calculate(){
  const total=state.recipe.reduce((sum,r)=>{
    const i=ingredient(r.ingredientId);
    return i ? sum+unitPrice(i)*r.usageAmount : sum;
  },0);

  const sale=Number($('salePrice').value)||0;
  const target=Number($('targetRate').value)||30;
  const round=Number($('roundingUnit').value)||100;
  const rate=sale>0 ? total/sale*100 : 0;
  const minPrice=target>0 ? total/(target/100) : 0;
  const recommended=Math.ceil(minPrice/round)*round;

  $('ingredientCount').textContent=state.recipe.length+'개';
  $('totalCostMetric').textContent=money(total);
  $('costRateMetric').textContent=pct(rate);
  $('recommendedMetric').textContent=money(recommended);

  let status='적정', cls='badge';
  if(!total||!sale) status='계산 대기';
  else if(rate>target+5){status='위험';cls+=' danger';}
  else if(rate>target){status='주의';cls+=' warn';}
  $('statusBadge').className=cls;
  $('statusBadge').textContent=status;

  const menu=$('menuName').value.trim()||'메뉴';
  $('resultText').innerHTML=
    `<strong>${menu}</strong>의 재료 수는 <strong>${state.recipe.length}개</strong>, 총원가는 <strong>${money(total)}</strong>입니다.<br>
     현재 판매가 기준 원가율은 <strong>${pct(rate)}</strong>이며, 목표 원가율 ${target}%에 맞춘 권장 판매가는 <strong>${money(recommended)}</strong>입니다.`;
}

function renderAll(){ renderIngredients(); renderRecipe(); calculate(); }

$('purchaseUnit').onchange=updatePreview;
$('purchasePrice').oninput=updatePreview;

$('addIngredientBtn').onclick=()=>{
  const name=$('ingredientName').value.trim();
  const price=Number($('purchasePrice').value);
  if(!name||price<=0){ alert('재료명과 매입가를 입력해주세요.'); return; }
  state.ingredients.push({
    id:Date.now(), name,
    type:$('ingredientType').value,
    purchaseUnit:$('purchaseUnit').value,
    purchasePrice:price
  });
  $('ingredientName').value='';
  $('purchasePrice').value='';
  updatePreview();
  renderAll();
};

$('addRecipeBtn').onclick=()=>{
  const id=Number($('recipeIngredient').value);
  const amount=Number($('usageAmount').value);
  if(!id||amount<=0){ alert('재료와 사용량을 입력해주세요.'); return; }
  const existing=state.recipe.find(x=>x.ingredientId===id);
  if(existing) existing.usageAmount+=amount;
  else state.recipe.push({ingredientId:id,usageAmount:amount});
  $('usageAmount').value='';
  renderAll();
};

['menuName','salePrice','targetRate','roundingUnit'].forEach(id=>{
  $(id).addEventListener('input',calculate);
  $(id).addEventListener('change',calculate);
});

renderAll();
</script>
</body>
</html>
