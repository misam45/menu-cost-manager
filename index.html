<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="메뉴별 원가와 권장 판매가를 관리하는 메뉴 수익성 관리 MVP">
  <title>Menu Profitability</title>
  <style>
    :root{
      --bg:#f5f6f8;--surface:#fff;--line:#e5e7eb;--text:#20242a;--muted:#6b7280;
      --brand:#2d4737;--brand-soft:#edf3ef;--warn:#b45309;--warn-bg:#fff7ed;
      --danger:#b42318;--danger-bg:#fef3f2;--ok:#16794a;--ok-bg:#ecfdf3;
      --sidebar:248px;--radius:16px;--shadow:0 5px 18px rgba(20,25,30,.05)
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh}
    .sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#17231d;color:#fff;padding:24px 18px;overflow:auto}
    .logo{font-size:19px;font-weight:800;letter-spacing:-.3px;padding:5px 10px 22px}
    .logo small{display:block;font-size:11px;font-weight:500;color:#9fb0a7;margin-top:4px}
    .nav-title{font-size:11px;color:#81958a;padding:20px 12px 7px;text-transform:uppercase;letter-spacing:.08em}
    .nav-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#c9d4ce;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0}
    .nav-item:hover,.nav-item.active{background:#2a3a32;color:#fff}
    .nav-item.sub{padding-left:32px;font-size:14px}
    .main{margin-left:var(--sidebar);min-height:100vh}
    .topbar{height:70px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:20}
    .breadcrumb{font-size:14px;color:var(--muted)}
    .user{display:flex;align-items:center;gap:9px;font-size:13px}
    .avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
    .content{padding:30px 32px 60px;max-width:1440px;margin:auto}
    .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
    h1{font-size:27px;margin:0 0 7px;letter-spacing:-.5px}
    h2{font-size:18px;margin:0}
    .page-desc,.muted{color:var(--muted);font-size:14px}
    .btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:10px 14px;font-weight:700}
    .btn:hover{filter:brightness(.98)}
    .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
    .btn.danger{color:var(--danger)}
    .btn.small{padding:7px 10px;font-size:12px}
    .cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
    .card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .stat{padding:18px}
    .stat-label{font-size:13px;color:var(--muted)}
    .stat-value{font-size:26px;font-weight:800;margin:8px 0 3px}
    .stat-note{font-size:12px;color:var(--muted)}
    .grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
    .panel{padding:20px;margin-bottom:16px}
    .panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}
    .status-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .status-box{padding:16px;border-radius:12px;text-align:center}
    .status-box strong{display:block;font-size:23px;margin-bottom:5px}
    .ok{color:var(--ok);background:var(--ok-bg)}
    .warn{color:var(--warn);background:var(--warn-bg)}
    .danger{color:var(--danger);background:var(--danger-bg)}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
    .field{display:flex;flex-direction:column;gap:6px}
    .field label{font-size:13px;font-weight:700}
    input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--text)}
    input:focus,select:focus,textarea:focus{outline:2px solid #c7d7cc;border-color:var(--brand)}
    .search{min-width:260px;flex:1}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
    table{width:100%;border-collapse:collapse;min-width:760px;background:#fff}
    th,td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
    th{background:#fafafa;color:#667085;font-size:12px}
    tr:last-child td{border-bottom:0}
    .badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}
    .badge.ok{background:var(--ok-bg)}
    .badge.warn{background:var(--warn-bg)}
    .badge.danger{background:var(--danger-bg)}
    .badge.neutral{background:#f2f4f7;color:#475467}
    .empty{text-align:center;color:var(--muted);padding:42px 20px}
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
    .form-grid .full{grid-column:1/-1}
    .callout{background:var(--brand-soft);border-radius:12px;padding:14px;font-size:13px;color:#344d3f}
    .form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
    .recipe-builder{display:grid;grid-template-columns:1fr 130px auto;gap:10px;align-items:end;margin:15px 0}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .summary .box{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:15px}
    .summary .box span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
    .summary .box strong{font-size:20px}
    .bar-row{display:grid;grid-template-columns:130px 1fr 72px;gap:10px;align-items:center;margin:12px 0;font-size:13px}
    .bar{height:10px;border-radius:999px;background:#edf0f2;overflow:hidden}
    .bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
    .mobile-menu{display:none}
    .toast{position:fixed;right:24px;bottom:24px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;z-index:99;font-size:13px}
    .toast.show{opacity:1;transform:none}
    @media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.grid-2{grid-template-columns:1fr}}
    @media(max-width:760px){
      :root{--sidebar:0px}.sidebar{transform:translateX(-100%);width:250px;transition:.2s;z-index:40}.sidebar.open{transform:none}
      .main{margin-left:0}.mobile-menu{display:block}.topbar{padding:0 16px}.content{padding:22px 14px 45px}
      .cards{grid-template-columns:1fr 1fr}.form-grid,.summary{grid-template-columns:1fr}.recipe-builder{grid-template-columns:1fr}
      .page-head{flex-direction:column}.status-row{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo">Menu Profitability<small>메뉴 수익성 관리</small></div>
    <button class="nav-item active" data-page="dashboard">▦ 대시보드</button>

    <div class="nav-title">원재료 관리</div>
    <button class="nav-item sub" data-page="ingredients">원재료 리스트</button>

    <div class="nav-title">메뉴 관리</div>
    <button class="nav-item sub" data-page="menus">메뉴 리스트</button>

    <div class="nav-title">원가 분석</div>
    <button class="nav-item sub" data-page="analysis">메뉴별 원가 현황</button>
    <button class="nav-item sub" data-page="risk">원가율 위험 메뉴</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn mobile-menu" id="mobileMenu">☰</button>
        <div class="breadcrumb" id="breadcrumb">대시보드</div>
      </div>
      <div class="user"><div class="avatar">M</div><span>관리자</span></div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY='menu-profitability-v2';
const seed={
 ingredients:[
  {id:1,name:'원두',type:'원재료',purchaseUnit:'kg',purchasePrice:30000,memo:'하우스 블렌드',updatedAt:'2026-07-23'},
  {id:2,name:'우유',type:'원재료',purchaseUnit:'L',purchasePrice:2500,memo:'일반 우유',updatedAt:'2026-07-23'},
  {id:3,name:'아이스컵',type:'일회용품',purchaseUnit:'개',purchasePrice:70,memo:'16oz',updatedAt:'2026-07-23'},
  {id:4,name:'뚜껑',type:'일회용품',purchaseUnit:'개',purchasePrice:30,memo:'아이스컵 전용',updatedAt:'2026-07-23'},
  {id:5,name:'바닐라시럽',type:'원재료',purchaseUnit:'L',purchasePrice:12000,memo:'',updatedAt:'2026-07-23'}
 ],
 menus:[
  {id:101,name:'아이스 카페라테',category:'커피',salePrice:4000,targetRate:30,rounding:100,recipe:[{ingredientId:1,amount:18},{ingredientId:2,amount:200},{ingredientId:3,amount:1},{ingredientId:4,amount:1}],updatedAt:'2026-07-23'},
  {id:102,name:'바닐라라테',category:'커피',salePrice:4200,targetRate:30,rounding:100,recipe:[{ingredientId:1,amount:18},{ingredientId:2,amount:200},{ingredientId:3,amount:1},{ingredientId:4,amount:1},{ingredientId:5,amount:30}],updatedAt:'2026-07-23'}
 ]
};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(seed);
let currentPage='dashboard';
let editingIngredient=null, editingMenu=null;
let draftRecipe=[];

const $=s=>document.querySelector(s);
const money=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';
const dateNow=()=>new Date().toISOString().slice(0,10);
const unitUse=u=>u==='kg'?'g':u==='L'?'ml':u;
const divisor=u=>(u==='kg'||u==='L')?1000:1;
const unitPrice=i=>Number(i.purchasePrice)/divisor(i.purchaseUnit);
const ingredient=id=>state.ingredients.find(x=>x.id===Number(id));
const menuCost=m=>(m.recipe||[]).reduce((s,r)=>{const i=ingredient(r.ingredientId);return s+(i?unitPrice(i)*Number(r.amount):0)},0);
const menuRate=m=>m.salePrice?menuCost(m)/Number(m.salePrice)*100:0;
const recommended=m=>Math.ceil((menuCost(m)/(Number(m.targetRate)/100))/Number(m.rounding||100))*Number(m.rounding||100);
function status(m){const r=menuRate(m),t=Number(m.targetRate);return r<=t?'적정':r<=t+5?'주의':'위험'}
function statusClass(s){return s==='적정'?'ok':s==='주의'?'warn':'danger'}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function pageTitle(p){return ({dashboard:'대시보드',ingredients:'원재료 관리 > 원재료 리스트','ingredient-form':'원재료 관리 > 원재료 등록·편집',menus:'메뉴 관리 > 메뉴 리스트','menu-form':'메뉴 관리 > 메뉴 등록·편집',analysis:'원가 분석 > 메뉴별 원가 현황',risk:'원가 분석 > 원가율 위험 메뉴'})[p]}
function go(page){
 currentPage=page; location.hash=page; $('#breadcrumb').textContent=pageTitle(page);
 document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x.dataset.page===page));
 $('#sidebar').classList.remove('open'); render();
}
function actions(){
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{editingIngredient=null;editingMenu=null;go(b.dataset.page)});
}
function header(title,desc,button=''){return `<div class="page-head"><div><h1>${title}</h1><div class="page-desc">${desc}</div></div>${button}</div>`}

function dashboard(){
 const avgCost=state.menus.length?state.menus.reduce((s,m)=>s+menuCost(m),0)/state.menus.length:0;
 const avgRate=state.menus.length?state.menus.reduce((s,m)=>s+menuRate(m),0)/state.menus.length:0;
 const counts={적정:0,주의:0,위험:0};state.menus.forEach(m=>counts[status(m)]++);
 const rows=state.menus.slice(-5).reverse().map(m=>`<tr><td><b>${m.name}</b><div class="muted">${m.category}</div></td><td>${money(menuCost(m))}</td><td>${money(m.salePrice)}</td><td>${menuRate(m).toFixed(1)}%</td><td><span class="badge ${statusClass(status(m))}">${status(m)}</span></td></tr>`).join('');
 return header('대시보드','메뉴 원가와 수익성 현황을 한눈에 확인합니다.',`<button class="btn primary" onclick="go('menu-form')">+ 메뉴 등록</button>`)
 +`<div class="cards">
  <div class="card stat"><div class="stat-label">등록 원재료</div><div class="stat-value">${state.ingredients.length}개</div><div class="stat-note">원재료 및 일회용품</div></div>
  <div class="card stat"><div class="stat-label">등록 메뉴</div><div class="stat-value">${state.menus.length}개</div><div class="stat-note">레시피 등록 완료</div></div>
  <div class="card stat"><div class="stat-label">평균 메뉴 원가</div><div class="stat-value">${money(avgCost)}</div><div class="stat-note">등록 메뉴 평균</div></div>
  <div class="card stat"><div class="stat-label">평균 원가율</div><div class="stat-value">${avgRate.toFixed(1)}%</div><div class="stat-note">현재 판매가 기준</div></div>
  <div class="card stat"><div class="stat-label">위험 메뉴</div><div class="stat-value">${counts.위험}개</div><div class="stat-note">목표 대비 +5%p 초과</div></div>
 </div>
 <div class="grid-2">
  <div class="panel"><div class="panel-head"><h2>최근 등록 메뉴</h2><button class="btn small" onclick="go('menus')">전체 보기</button></div>
   <div class="table-wrap"><table><thead><tr><th>메뉴</th><th>원가</th><th>판매가</th><th>원가율</th><th>상태</th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="empty">등록된 메뉴가 없습니다.</td></tr>`}</tbody></table></div>
  </div>
  <div class="panel"><div class="panel-head"><h2>원가율 상태</h2></div>
   <div class="status-row"><div class="status-box ok"><strong>${counts.적정}</strong>적정</div><div class="status-box warn"><strong>${counts.주의}</strong>주의</div><div class="status-box danger"><strong>${counts.위험}</strong>위험</div></div>
   <div style="margin-top:18px" class="callout">원재료 매입가를 수정하면 해당 원재료를 사용하는 모든 메뉴의 원가가 자동으로 다시 계산됩니다.</div>
  </div>
 </div>`;
}
function ingredientList(){
 return header('원재료 리스트','매입 단위와 가격을 기준으로 사용 단가를 자동 환산합니다.',`<button class="btn primary" onclick="newIngredient()">+ 원재료 등록</button>`)
 +`<div class="panel"><div class="toolbar"><input id="ingSearch" class="search" placeholder="원재료명 검색"><select id="ingType"><option value="">전체 구분</option><option>원재료</option><option>일회용품</option></select></div><div id="ingTable"></div></div>`;
}
function renderIngredientTable(){
 const q=($('#ingSearch')?.value||'').toLowerCase(),type=$('#ingType')?.value||'';
 const list=state.ingredients.filter(i=>i.name.toLowerCase().includes(q)&&(!type||i.type===type));
 $('#ingTable').innerHTML=`<div class="table-wrap"><table><thead><tr><th>원재료명</th><th>구분</th><th>매입 단위</th><th>매입 가격</th><th>사용 단가</th><th>최근 수정일</th><th>관리</th></tr></thead><tbody>${list.map(i=>`<tr><td><b>${i.name}</b><div class="muted">${i.memo||''}</div></td><td><span class="badge neutral">${i.type}</span></td><td>${i.purchaseUnit}</td><td>${money(i.purchasePrice)}</td><td>${unitPrice(i).toFixed(2)}원/${unitUse(i.purchaseUnit)}</td><td>${i.updatedAt}</td><td><button class="btn small" onclick="editIngredient(${i.id})">편집</button> <button class="btn small danger" onclick="removeIngredient(${i.id})">삭제</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">검색 결과가 없습니다.</td></tr>`}</tbody></table></div>`;
}
function ingredientForm(){
 const i=editingIngredient||{name:'',type:'원재료',purchaseUnit:'kg',purchasePrice:'',memo:''};
 return header(editingIngredient?'원재료 편집':'원재료 등록','원재료의 매입 정보와 사용 단가를 관리합니다.')
 +`<div class="panel" style="max-width:800px"><form id="ingredientForm"><div class="form-grid">
  <div class="field"><label>원재료명 *</label><input id="iName" value="${i.name}" required placeholder="예: 원두"></div>
  <div class="field"><label>구분 *</label><select id="iType"><option ${i.type==='원재료'?'selected':''}>원재료</option><option ${i.type==='일회용품'?'selected':''}>일회용품</option></select></div>
  <div class="field"><label>매입 단위 *</label><select id="iUnit"><option ${i.purchaseUnit==='kg'?'selected':''}>kg</option><option ${i.purchaseUnit==='g'?'selected':''}>g</option><option ${i.purchaseUnit==='L'?'selected':''}>L</option><option ${i.purchaseUnit==='ml'?'selected':''}>ml</option><option ${i.purchaseUnit==='개'?'selected':''}>개</option></select></div>
  <div class="field"><label>매입 가격(원) *</label><input id="iPrice" type="number" min="0" value="${i.purchasePrice}" required></div>
  <div class="field full"><label>메모</label><textarea id="iMemo" rows="3">${i.memo||''}</textarea></div>
  <div class="full callout" id="unitPreview">가격을 입력하면 사용 단가가 표시됩니다.</div>
 </div><div class="form-actions"><button type="button" class="btn" onclick="go('ingredients')">취소</button><button class="btn primary">저장</button></div></form></div>`;
}
function menuList(){
 return header('메뉴 리스트','메뉴별 원가율과 권장 판매가를 비교합니다.',`<button class="btn primary" onclick="newMenu()">+ 메뉴 등록</button>`)
 +`<div class="panel"><div class="toolbar"><input id="menuSearch" class="search" placeholder="메뉴명 검색"><select id="menuStatus"><option value="">전체 상태</option><option>적정</option><option>주의</option><option>위험</option></select></div><div id="menuTable"></div></div>`;
}
function renderMenuTable(){
 const q=($('#menuSearch')?.value||'').toLowerCase(),s=$('#menuStatus')?.value||'';
 const list=state.menus.filter(m=>m.name.toLowerCase().includes(q)&&(!s||status(m)===s));
 $('#menuTable').innerHTML=`<div class="table-wrap"><table><thead><tr><th>메뉴명</th><th>재료 수</th><th>총원가</th><th>판매가</th><th>원가율</th><th>목표</th><th>권장 판매가</th><th>상태</th><th>관리</th></tr></thead><tbody>${list.map(m=>`<tr><td><b>${m.name}</b><div class="muted">${m.category}</div></td><td>${m.recipe.length}개</td><td>${money(menuCost(m))}</td><td>${money(m.salePrice)}</td><td>${menuRate(m).toFixed(1)}%</td><td>${m.targetRate}%</td><td>${money(recommended(m))}</td><td><span class="badge ${statusClass(status(m))}">${status(m)}</span></td><td><button class="btn small" onclick="editMenu(${m.id})">편집</button> <button class="btn small danger" onclick="removeMenu(${m.id})">삭제</button></td></tr>`).join('')||`<tr><td colspan="9" class="empty">등록된 메뉴가 없습니다.</td></tr>`}</tbody></table></div>`;
}
function menuForm(){
 const m=editingMenu||{name:'',category:'커피',salePrice:4000,targetRate:30,rounding:100,recipe:[]};
 if(!draftRecipe.length && editingMenu) draftRecipe=structuredClone(m.recipe);
 return header(editingMenu?'메뉴 편집':'메뉴 등록','레시피 사용량을 입력하면 원가와 권장 판매가가 자동 계산됩니다.')
 +`<form id="menuForm"><div class="grid-2">
  <div>
   <div class="panel"><div class="panel-head"><h2>기본 정보</h2></div><div class="form-grid">
    <div class="field"><label>메뉴명 *</label><input id="mName" value="${m.name}" required></div>
    <div class="field"><label>카테고리</label><select id="mCategory">${['커피','음료','디저트','푸드','기타'].map(x=>`<option ${m.category===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="field"><label>현재 판매가(원) *</label><input id="mSale" type="number" min="0" value="${m.salePrice}" required></div>
    <div class="field"><label>목표 원가율(%) *</label><input id="mTarget" type="number" min="1" max="100" step=".1" value="${m.targetRate}" required></div>
    <div class="field"><label>판매가 반올림</label><select id="mRound"><option value="10" ${m.rounding==10?'selected':''}>10원</option><option value="100" ${m.rounding==100?'selected':''}>100원</option><option value="500" ${m.rounding==500?'selected':''}>500원</option></select></div>
   </div></div>
   <div class="panel"><div class="panel-head"><h2>레시피 등록</h2></div>
    <div class="recipe-builder"><div class="field"><label>원재료 선택</label><select id="recipeIng">${state.ingredients.map(i=>`<option value="${i.id}">${i.name} (${unitUse(i.purchaseUnit)})</option>`).join('')}</select></div><div class="field"><label>사용량</label><input id="recipeAmount" type="number" min=".001" step=".001"></div><button type="button" class="btn" id="addRecipe">추가</button></div>
    <div id="recipeTable"></div>
   </div>
  </div>
  <div>
   <div class="panel" style="position:sticky;top:90px"><div class="panel-head"><h2>자동 원가 계산</h2><span id="liveStatus"></span></div><div id="liveSummary"></div>
    <div class="form-actions"><button type="button" class="btn" onclick="go('menus')">취소</button><button class="btn primary">메뉴 저장</button></div>
   </div>
  </div>
 </div></form>`;
}
function renderRecipe(){
 const rows=draftRecipe.map((r,idx)=>{const i=ingredient(r.ingredientId);if(!i)return'';return `<tr><td><b>${i.name}</b><div class="muted">${i.type}</div></td><td>${r.amount}${unitUse(i.purchaseUnit)}</td><td>${money(unitPrice(i)*r.amount)}</td><td><button type="button" class="btn small danger" onclick="draftRecipe.splice(${idx},1);renderRecipe();liveCalc()">삭제</button></td></tr>`}).join('');
 $('#recipeTable').innerHTML=`<div class="table-wrap"><table><thead><tr><th>원재료</th><th>사용량</th><th>원가</th><th>관리</th></tr></thead><tbody>${rows||`<tr><td colspan="4" class="empty">레시피에 원재료를 추가해주세요.</td></tr>`}</tbody></table></div>`;
}
function liveCalc(){
 if(!$('#mSale'))return;
 const temp={salePrice:Number($('#mSale').value)||0,targetRate:Number($('#mTarget').value)||30,rounding:Number($('#mRound').value)||100,recipe:draftRecipe};
 const raw=menuCost(temp),material=draftRecipe.reduce((s,r)=>{const i=ingredient(r.ingredientId);return s+(i?.type==='원재료'?unitPrice(i)*r.amount:0)},0),pack=raw-material;
 const st=status(temp);
 $('#liveStatus').innerHTML=`<span class="badge ${statusClass(st)}">${st}</span>`;
 $('#liveSummary').innerHTML=`<div class="summary"><div class="box"><span>재료비</span><strong>${money(material)}</strong></div><div class="box"><span>일회용품비</span><strong>${money(pack)}</strong></div><div class="box"><span>총원가</span><strong>${money(raw)}</strong></div><div class="box"><span>재료 수</span><strong>${draftRecipe.length}개</strong></div></div>
 <div class="callout" style="margin-top:14px">현재 판매가 기준 원가율은 <b>${menuRate(temp).toFixed(1)}%</b>이며, 목표 원가율 ${temp.targetRate}%에 맞춘 권장 판매가는 <b>${money(recommended(temp))}</b>입니다.</div>`;
}
function analysis(riskOnly=false){
 const list=state.menus.filter(m=>!riskOnly||status(m)==='위험').sort((a,b)=>menuRate(b)-menuRate(a));
 const max=Math.max(1,...list.map(menuRate));
 return header(riskOnly?'원가율 위험 메뉴':'메뉴별 원가 현황',riskOnly?'가격 또는 레시피 조정이 우선 필요한 메뉴를 확인합니다.':'메뉴별 원가율을 비교하고 목표치를 초과한 메뉴를 찾습니다.')
 +`<div class="panel"><div class="panel-head"><h2>${riskOnly?'위험 메뉴':'원가율 비교'}</h2><span class="muted">${list.length}개 메뉴</span></div>${list.map(m=>`<div class="bar-row"><div><b>${m.name}</b><div class="muted">${money(menuCost(m))}</div></div><div class="bar"><i style="width:${Math.min(100,menuRate(m)/max*100)}%"></i></div><div><b>${menuRate(m).toFixed(1)}%</b></div></div>`).join('')||`<div class="empty">${riskOnly?'위험 상태의 메뉴가 없습니다.':'등록된 메뉴가 없습니다.'}</div>`}</div>
 <div class="panel"><div class="table-wrap"><table><thead><tr><th>메뉴</th><th>총원가</th><th>현재 판매가</th><th>현재 원가율</th><th>목표 원가율</th><th>차이</th><th>권장 판매가</th><th>상태</th></tr></thead><tbody>${list.map(m=>`<tr><td><b>${m.name}</b></td><td>${money(menuCost(m))}</td><td>${money(m.salePrice)}</td><td>${menuRate(m).toFixed(1)}%</td><td>${m.targetRate}%</td><td>${(menuRate(m)-m.targetRate).toFixed(1)}%p</td><td>${money(recommended(m))}</td><td><span class="badge ${statusClass(status(m))}">${status(m)}</span></td></tr>`).join('')||`<tr><td colspan="8" class="empty">표시할 데이터가 없습니다.</td></tr>`}</tbody></table></div></div>`;
}
function render(){
 const map={dashboard,ingredients:ingredientList,'ingredient-form':ingredientForm,menus:menuList,'menu-form':menuForm,analysis:()=>analysis(false),risk:()=>analysis(true)};
 $('#content').innerHTML=map[currentPage]();
 if(currentPage==='ingredients'){renderIngredientTable();$('#ingSearch').oninput=renderIngredientTable;$('#ingType').onchange=renderIngredientTable}
 if(currentPage==='ingredient-form') bindIngredientForm();
 if(currentPage==='menus'){renderMenuTable();$('#menuSearch').oninput=renderMenuTable;$('#menuStatus').onchange=renderMenuTable}
 if(currentPage==='menu-form') bindMenuForm();
}
function bindIngredientForm(){
 const preview=()=>{const p=Number($('#iPrice').value)||0,u=$('#iUnit').value;$('#unitPreview').innerHTML=p?`${u}당 <b>${money(p)}</b> → ${unitUse(u)}당 <b>${(p/divisor(u)).toFixed(2)}원</b>`:'가격을 입력하면 사용 단가가 표시됩니다.'};
 $('#iPrice').oninput=preview;$('#iUnit').onchange=preview;preview();
 $('#ingredientForm').onsubmit=e=>{e.preventDefault();const obj={id:editingIngredient?.id||Date.now(),name:$('#iName').value.trim(),type:$('#iType').value,purchaseUnit:$('#iUnit').value,purchasePrice:Number($('#iPrice').value),memo:$('#iMemo').value.trim(),updatedAt:dateNow()};if(editingIngredient)state.ingredients=state.ingredients.map(x=>x.id===obj.id?obj:x);else state.ingredients.push(obj);save();editingIngredient=null;toast('원재료를 저장했습니다.');go('ingredients')};
}
function bindMenuForm(){
 renderRecipe();liveCalc();
 ['mSale','mTarget','mRound'].forEach(id=>{document.getElementById(id).oninput=liveCalc;document.getElementById(id).onchange=liveCalc});
 $('#addRecipe').onclick=()=>{const id=Number($('#recipeIng').value),amount=Number($('#recipeAmount').value);if(!id||amount<=0)return alert('원재료와 사용량을 입력해주세요.');const ex=draftRecipe.find(x=>x.ingredientId===id);if(ex)ex.amount+=amount;else draftRecipe.push({ingredientId:id,amount});$('#recipeAmount').value='';renderRecipe();liveCalc()};
 $('#menuForm').onsubmit=e=>{e.preventDefault();if(!draftRecipe.length)return alert('레시피를 1개 이상 등록해주세요.');const obj={id:editingMenu?.id||Date.now(),name:$('#mName').value.trim(),category:$('#mCategory').value,salePrice:Number($('#mSale').value),targetRate:Number($('#mTarget').value),rounding:Number($('#mRound').value),recipe:structuredClone(draftRecipe),updatedAt:dateNow()};if(editingMenu)state.menus=state.menus.map(x=>x.id===obj.id?obj:x);else state.menus.push(obj);save();editingMenu=null;draftRecipe=[];toast('메뉴를 저장했습니다.');go('menus')};
}
function newIngredient(){editingIngredient=null;go('ingredient-form')}
function editIngredient(id){editingIngredient=structuredClone(ingredient(id));go('ingredient-form')}
function removeIngredient(id){if(state.menus.some(m=>m.recipe.some(r=>r.ingredientId===id)))return alert('등록된 메뉴에서 사용 중인 원재료는 삭제할 수 없습니다.');if(confirm('원재료를 삭제할까요?')){state.ingredients=state.ingredients.filter(x=>x.id!==id);save();renderIngredientTable();toast('삭제했습니다.')}}
function newMenu(){editingMenu=null;draftRecipe=[];go('menu-form')}
function editMenu(id){editingMenu=structuredClone(state.menus.find(x=>x.id===id));draftRecipe=structuredClone(editingMenu.recipe);go('menu-form')}
function removeMenu(id){if(confirm('메뉴를 삭제할까요?')){state.menus=state.menus.filter(x=>x.id!==id);save();renderMenuTable();toast('삭제했습니다.')}}
$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');
actions();
const hash=location.hash.replace('#','');if(['dashboard','ingredients','ingredient-form','menus','menu-form','analysis','risk'].includes(hash))currentPage=hash;
go(currentPage);
</script>
</body>
</html>
